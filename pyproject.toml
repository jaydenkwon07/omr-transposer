[project]
name = "omr-transposer"
version = "0.0.0"
description = "Photo of sheet music in, transposed notation out. Project 0: symbolic layer."
requires-python = ">=3.12"
dependencies = [
    "music21>=9.1",
    "verovio>=4.3",
    "cairosvg>=2.7",
    "pypdf>=4.2",
]

[project.optional-dependencies]
# Project 1 raster pipeline. Kept out of core so the Project 0 CLI (transpose +
# PDF render) installs without the heavy image stack. opencv is pinned because
# warpPerspective/remap and JPEG encoding are only byte-reproducible within one
# OpenCV build — the determinism guarantee is same-machine (see ADR 0008).
datagen = [
    "numpy>=2.0",
    "pillow>=10.3",
    "opencv-python-headless==4.10.0.84",
]

# Project 2 model stack. Kept out of core so the Project 0 CLI installs without torch.
# numpy + opencv mirror the datagen image stack (reused via read_gray_over_white).
models = [
    "torch>=2.3",
    "numpy>=2.0",
    "opencv-python-headless==4.10.0.84",
]

[project.scripts]
omrt = "omrt.symbolic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omrt"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# cv2 ships inline stubs whose overloads fight strict mode over trivia (borderValue
# Sequence[float], Mat vs ndarray). Treat it as opaque; we restore typing where we return
# a cv2 result. cairosvg has no stubs at all.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cairosvg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
